app:
  env: development
  host: 127.0.0.1
  port: 8000

paths:
  sample_data: data/samples
  generated_data: data/generated
  frontend_demo: frontend/demo

animation:
  default_renderer: canvas_2d
  allowed_renderers:
    - canvas_2d
    - svg_2d
    - three_3d
  # 无音轨版本使用阅读速度为每个视觉节拍确定持续帧数。
  cjk_chars_per_second: 8.0
  latin_words_per_minute: 180.0
  min_beat_seconds: 3.0
  max_reading_seconds: 12.0
  beat_end_hold_seconds: 0.6

agent:
  # 整部讲解动画的教学节拍（step）总数上限。
  max_storyboard_steps: 7
  require_visual_objects: true
  require_interactive_demo: true

storyboard:
  # 整部讲解动画的节拍总数下限。上限沿用上面的 agent.max_storyboard_steps。
  min_storyboard_steps: 3
  # 比 knowledge 的 0.4 低：这一层是 schema 密集型，创作部分上游已经做完。
  temperature: 0.3
  max_retries: 3
  # 如果前面的次数都用于修 schema，为 intent 模式保留的语义修复次数。
  intent_semantic_repair_attempts: 1

llm:
  base_url: https://api.deepseek.com
  model: deepseek-v4-pro

knowledge:
  # 场景数上限（硬校验，超出会打回重试）。prompt 引导 6~8，这里留一点余量。
  max_scenes: 8
  max_retries: 3
  temperature: 0.4
  # 要求原文每个 section / block 都至少被一个场景引用到，防止漏内容。
  # 若接入的文档带大量导航/页脚等噪声导致频繁重试，可改成 false。
  require_full_coverage: true
  # 生成后再调一次模型，核对「原文有没有被漏讲、课程有没有编原文没有的东西」。
  # 每次生成多一次 LLM 调用，默认关闭；打开前建议先用真实模型验证误报率。
  verify_fidelity: false
