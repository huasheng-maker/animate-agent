<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animate Agent · Knowledge Movie Player</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="./player.css" />
  </head>
  <body>
    <header class="bar">
      <div>
        <div class="player-brand"><span class="player-brand-mark"></span> ANIMATE/AGENT <em>PLAYER</em></div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title">载入中…</h1>
        <p class="goal" id="goal"></p>
      </div>
      <div class="transport">
        <button type="button" id="prev" title="上一教学拍（←）">上一拍</button>
        <button type="button" id="play" title="播放 / 暂停（空格）">暂停</button>
        <button type="button" id="frame-prev" title="暂停并后退一帧（,）">上一帧</button>
        <button type="button" id="frame-next" title="暂停并前进一帧（.）">下一帧</button>
        <button type="button" id="step" title="暂停并推进一个教学拍（→）">下一拍</button>
        <button type="button" id="reset" title="回到第一拍">重置</button>
        <output id="frame-position" class="frame-position" aria-live="off">帧 0</output>
        <label class="speed-control" for="playback-rate">
          <span>速度</span>
          <select id="playback-rate" aria-label="播放速度">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select>
        </label>
      </div>
    </header>

    <main class="layout">
      <section class="stage-wrap">
        <canvas id="stage"></canvas>
        <!--
          Errors are rendered on the page rather than swallowed. A blank canvas
          and a badly-drawn one are indistinguishable to a person looking at the
          screen, so the player says which one it is (decision: visible errors).
        -->
        <pre class="error" id="error" hidden></pre>
      </section>

      <aside class="side">
        <div>
          <h2>控制台</h2>
          <div class="controls" id="controls"></div>
        </div>
        <div class="steps-block">
          <h2>教学节拍</h2>
          <ol class="steps" id="steps"></ol>
        </div>
      </aside>
    </main>

    <script src="./gsap.min.js"></script>
    <script type="module" src="./player.js"></script>
  </body>
</html>
