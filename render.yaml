# Render Blueprint for the public Xiaoyi demo. Secrets and service URLs are set in Render.
services:
  - type: web
    name: animate-agent-api
    runtime: python
    region: singapore
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: pip install -e .
    startCommand: python -m uvicorn animate_agent.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    disk:
      name: animation-runs
      mountPath: /opt/render/project/src/data/runs
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PUBLIC_DEMO_MODE
        value: "1"
      - key: XIAOYI_PLUGIN_TOKEN
        generateValue: true

  - type: web
    name: animate-agent-web
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: off
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
